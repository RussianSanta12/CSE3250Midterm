<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Joke History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 2rem auto; max-width: 720px; line-height: 1.5; padding: 0 1rem; }
    h1 { margin-top: 0; }
    ol { padding-left: 1.25rem; }
    li { margin: 0.25rem 0; }
    .actions { margin: 1rem 0; }
    .empty { color: #777; }
  </style>
</head>
<body>
  <h1>Joke History</h1>

  {% if history and history|length > 0 %}
    <ol>
      {% for j in history %}
        <li>{{ j }}</li>
      {% endfor %}
    </ol>
  {% else %}
    <p class="empty">No jokes yet.</p>
  {% endif %}

  <div class="actions">
    <a class="link-btn" href="{{ url_for('joke') }}"
      style="display:inline-block; padding:0.6rem 1rem; border-radius:8px; border:1px solid rgba(146, 123, 123, 0.568); background:#2d6cdf; color:white; text-decoration:none; cursor:pointer; font-weight:600;">
      Back Home
    </a>
  </div>
</body>
</html>
